{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "capture-pipeline.fullname" . }}
  labels:
    {{- include "capture-pipeline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.internalPort }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort:  {{ .Values.service.outerPort }}
      {{- end }}
  selector:
    {{- include "capture-pipeline.selectorLabels" . | nindent 4 }}
{{- end }}
